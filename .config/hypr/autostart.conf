# Extra autostart processes
# exec-once = uwsm-app -- my-service
#
# Extra autostart processes
# exec-once = uwsm-app -- my-service

# hypridle is managed by systemd (hypridle.service); kill the duplicate spawned
# by the Omarchy default autostart so only one instance runs the current config.
exec-once = sleep 3 && pkill -o hypridle
exec-once = ydotoold
env = YDOTOOL_SOCKET,/run/user/1000/.ydotool_socket

#exec-once = waybar -c ~/.config/waybar/config-main.jsonc
#exec-once = waybar -c ~/.config/waybar/config-secondary.jsonc

# Kill swaybg and start awww daemon on boot
exec-once = pkill swaybg; awww-daemon

# Set initial wallpaper after a brief delay
exec-once = sleep 2 && awww img ~/.config/omarchy/current/background --transition-type=grow --transition-duration=1.5 --transition-fps=60 --transition-pos=center
exec-once = ~/.config/waybar/scripts/nowplaying-listener.sh

exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = /usr/lib/hyprwhspr/bin/hyprwhspr

exec-once = copyq --start-server
exec-once = clipse --listen
exec-once = ~/.config/waybar/scripts/nowplaying-watch.sh
exec-once = ~/.local/bin/clipboard-watcher.sh

exec-once = qs -c "QuickShell Bar"

#exec-once = waybar -c ~/.config/waybar/config-main.jsonc & sleep 0.5 && waybar -c ~/.config/waybar/config-secondary.jsonc
